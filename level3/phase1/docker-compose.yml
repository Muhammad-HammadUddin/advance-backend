services:
  nginx:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app-network

  server1:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME="first server"
    ports:
      - 5001:7000
    networks:
      - app-network

  server2:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME="second server"
    ports:
      - 5002:7000
    networks:
      - app-network

  server3:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME="third server"
    ports:
      - 5003:7000
    networks:
      - app-network

  redis:
    image: redis
    ports:
      - 6379:6379
    networks:
      - app-network

networks:
  app-network: